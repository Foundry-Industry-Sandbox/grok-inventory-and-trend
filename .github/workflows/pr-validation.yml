name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'agent-provisioning/**'
      - 'frontend/**'
      - 'InventoryPlanning.sln'
      - 'NuGet.Config'
      - 'infra/**'
      - '.github/workflows/pr-validation.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      bicep: ${{ steps.filter.outputs.bicep }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'backend/**'
              - 'agent-provisioning/**'
              - 'frontend/**'
              - 'InventoryPlanning.sln'
              - 'NuGet.Config'
              - '.github/workflows/pr-validation.yml'
            bicep:
              - 'infra/**'
              - '.github/workflows/pr-validation.yml'

  dotnet-validation:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore InventoryPlanning.sln --configfile NuGet.Config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json

      - name: Build solution
        run: dotnet build InventoryPlanning.sln -c Release -m:1 --no-restore

      - name: Restore WebApp
        run: dotnet restore frontend/src/GrokInventoryAndTrend.WebApp/GrokInventoryAndTrend.WebApp.csproj --configfile NuGet.Config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json

      - name: Build WebApp
        run: dotnet build frontend/src/GrokInventoryAndTrend.WebApp/GrokInventoryAndTrend.WebApp.csproj -c Release --no-restore

      - name: Restore AgentProvisioning
        run: dotnet restore agent-provisioning/src/GrokInventoryAndTrend.AgentProvisioning/GrokInventoryAndTrend.AgentProvisioning.csproj --configfile NuGet.Config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json

      - name: Build AgentProvisioning
        run: dotnet build agent-provisioning/src/GrokInventoryAndTrend.AgentProvisioning/GrokInventoryAndTrend.AgentProvisioning.csproj -c Release --no-restore

  bicep-validation:
    needs: changes
    if: needs.changes.outputs.bicep == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep
